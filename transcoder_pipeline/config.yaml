name: "Transcoder Pipeline"
description: "Scan your media library and transcode MKV, AVI and other videos to MP4 with FFmpeg. Uses Intel Quick Sync hardware encoding. Includes a Sonarr/Radarr webhook and Jellyfin rescan."
version: "2.13.0"
slug: "transcoder_pipeline"
init: false
arch:
  - amd64
devices:
  - /dev/dri/renderD128
startup: application
boot: auto
ports:
  "5000/tcp": 5000
ports_description:
  "5000/tcp": "Sonarr/Radarr webhook (and direct web access on your local network)"
ingress: true
ingress_port: 8099
panel_icon: mdi:video-vintage
panel_title: "Transcoder"
watchdog: "http://[HOST]:[PORT:5000]/"
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
